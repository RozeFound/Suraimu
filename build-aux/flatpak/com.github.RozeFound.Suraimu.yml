id: com.github.RozeFound.Suraimu
runtime: org.gnome.Platform
runtime-version: master
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm18
command: suraimu

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.steam/steam
  - --filesystem=~/.steam/steam
  - --env=RUST_LOG=fractal=debug,warn
  - --env=G_MESSAGES_DEBUG=none
  - --env=RUST_BACKTRACE=1
  - --env=NO_POINTER_VIEWPORT=1


build-options:

  append-ld-library-path: /usr/lib/sdk/llvm18/lib
  append-path: '/usr/lib/sdk/llvm18/bin:/usr/lib/sdk/rust-stable/bin'

  env:
    CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
    CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=/usr/lib/sdk/rust-stable/bin/mold'

  build-args:
    - --share=network

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"

modules:

  # Other Dependencies
  - name: blueprint-compiler
    buildsystem: meson
    cleanup:
      - "*"
    sources:
    - type: git
      url: https://gitlab.gnome.org/jwestman/blueprint-compiler.git
      branch: main

  - name: suraimu
    builddir: true
    buildsystem: meson
    config-opts:
      - -Ddevel=true
    sources:
      - type: dir
        path: "../../"